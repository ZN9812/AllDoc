# 한 대의 서버에서 바로 띄우는 예시입니다. .env 를 채운 뒤:  docker compose up -d --build
# HTTPS(구글 로그인에 필요)는 앞단의 역방향 프록시(Caddy, nginx 등)가 맡습니다. docs/DEPLOY.md 를 보세요.
services:
  alldoc:
    build: .
    image: alldoc:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # 컨테이너 안의 값. .env 의 PORT 는 컨테이너 안에서 듣는 포트이므로 아래 ports 와 맞춰 두세요.
      DATA_DIR: /data
    ports:
      - "8787:8787"
    volumes:
      - alldoc-data:/data
      # 작업별 AI 설정 파일을 쓰려면 아래 줄의 주석을 풀고, .env 에 AI_CONFIG_PATH=/config/ai.json 을 적으세요(docs/AI.md).
      # - ./ai.json:/config/ai.json:ro
      # 요금제 파일을 쓰려면 아래 줄의 주석을 풀고, .env 에 PLANS_CONFIG_PATH=/config/plans.json 을 적으세요(docs/DEPLOY.md).
      # - ./plans.json:/config/plans.json:ro
    # LaTeX 컴파일 일꾼(아래 compiler)과 내부망으로만 이야기한다. .env 에 COMPILER=http, COMPILER_URLS=http://compiler:8790, COMPILER_SECRET 을 적으세요.
    networks:
      - default
      - compile

  # LaTeX 컴파일 일꾼(docs/LATEX.md "컴파일 서버"). 이미지가 커서(TeX Live·글꼴) 기본으로는 띄우지 않는다:
  #   docker compose --profile latex up -d --build
  # .env 를 통째로 넘기지 않는다(AI 키 같은 비밀값을 일꾼이 갖지 않도록). 서명 비밀값 하나만 넘긴다.
  compiler:
    profiles: ["latex"]
    build:
      context: .
      dockerfile: compiler/Dockerfile
    image: alldoc-compiler:latest
    restart: unless-stopped
    environment:
      COMPILER_SECRET: ${COMPILER_SECRET:-}
    # 내부망만 쓴다. 포트를 밖으로 열지 않는다.
    networks:
      - compile
    read_only: true
    tmpfs:
      - /work:size=1g,mode=1777
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Docker 기본 seccomp 에 bubblewrap 이 쓰는 7개 호출(unshare setns mount umount2 pivot_root clone clone3)만 더한 프로필
      - seccomp=./compiler/seccomp.json
      # Docker 의 기본 AppArmor 프로필(docker-default)은 mount 를 막아 bubblewrap 이 "Failed to make / slave" 로 멈춘다(CI 에서 확인).
      # 그래서 이 컨테이너만 AppArmor 를 풀고, 대신 seccomp·cap_drop·no-new-privileges·읽기 전용 루트와 작업마다의 bubblewrap 으로 막는다.
      # mount 만 허용하는 AppArmor 프로필을 따로 만들지는 결정 필요(docs/DEPLOY.md "LaTeX 컴파일").
      - apparmor=unconfined
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    # 가능하면 gVisor 를 쓴다(설치한 서버에서만): runtime: runsc

networks:
  compile:
    internal: true

volumes:
  alldoc-data:
